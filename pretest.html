<!doctype html>
<html lang="id">
<head>
<meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>SIMONUSA | Linux Fundamentals Pre-test</title>
<link rel="stylesheet" href="assets/css/style.css">
<style>
.test-wrap{max-width:980px;margin:28px auto;padding:0 18px}.qcard{background:var(--card,#fff);border:1px solid #d8dee8;border-radius:12px;padding:18px;margin:14px 0}.answers{display:grid;gap:9px;margin-top:12px}.answers label{display:flex;gap:10px;align-items:flex-start;padding:10px;border:1px solid #ccd4df;border-radius:8px;cursor:pointer}.answers label:has(input:checked){border-color:#2864c5;background:#edf4ff}.feedback{margin-top:10px;padding:10px;border-radius:8px}.good{background:#e7f6ec;color:#155b2b}.bad{background:#fff0e8;color:#8b3214}.muted{color:#667085}.toolbar{display:flex;gap:10px;flex-wrap:wrap;align-items:center}.toolbar button{padding:9px 14px}.progress{height:8px;background:#e8edf3;border-radius:9px;overflow:hidden}.progress span{display:block;height:100%;background:#2864c5;width:0}.result{font-size:1.15rem;font-weight:700}code{background:#eef1f5;padding:2px 5px;border-radius:4px}
</style></head>
<body><div class="test-wrap">
<nav><a href="index.html" data-id="Dashboard" data-en="Dashboard">Dashboard</a><a href="course.html" data-id="Course" data-en="Course">Course</a><a href="pretest.html" data-id="Pre-test Linux" data-en="Linux pre-test">Pre-test Linux</a></nav>
<div class="toolbar"><span class="kicker">SIMONUSA · LINUX FUNDAMENTALS</span><button id="lang" type="button">English</button></div>
<h1 id="title">Pre-test Dasar Linux</h1><p id="intro">Tes ini mengukur pemahaman perintah Linux umum yang sering digunakan sehari-hari. Soal tidak menguji perintah HPC, SLURM, atau ORCA.</p>
<div class="toolbar"><strong id="counter">0 / 20 dijawab</strong><div class="progress" style="flex:1;min-width:140px"><span id="bar"></span></div><button id="reset" type="button">Ulangi</button></div>
<div id="questions"></div>
<div class="qcard"><div id="score" class="result">Skor belum dihitung.</div><p id="summary" class="muted">Jawab semua soal untuk melihat skor akhir.</p><button id="finish" type="button">Hitung skor</button> <button id="csv" type="button" disabled>Unduh hasil CSV</button></div>
</div>
<script>
const bank=[
{t:["Perintah untuk mengetahui lokasi direktori kerja saat ini adalah …","Which command displays the current working directory?"],o:["pwd","ls","cd","whoami"],a:0,e:["pwd (print working directory) menampilkan path direktori tempat shell berada.","pwd (print working directory) prints the path of the directory where the shell is located."]},
{t:["Perintah untuk melihat daftar file dan folder pada direktori adalah …","Which command lists files and directories?"],o:["show","ls","dirpath","pwd"],a:1,e:["ls menampilkan isi direktori. Opsi -l memberi detail dan -a menampilkan file tersembunyi.","ls lists directory contents. -l shows details and -a includes hidden files."]},
{t:["Perintah berpindah ke direktori Documents adalah …","Which command changes to the Documents directory?"],o:["cd Documents","pwd Documents","mv Documents","ls Documents"],a:0,e:["cd (change directory) berpindah dari direktori kerja saat ini ke direktori tujuan.","cd (change directory) moves from the current directory to the target directory."]},
{t:["Simbol ~ pada path Linux biasanya merujuk ke …","In a Linux path, the ~ symbol usually refers to …"],o:["root filesystem","home directory pengguna","direktori sementara","direktori sebelumnya"],a:1,e:["~ adalah singkatan untuk home directory pengguna yang sedang login.","~ is shorthand for the home directory of the current user."]},
{t:["Perintah membuat folder bernama data adalah …","Which command creates a directory named data?"],o:["touch data","mkdir data","new data","cp data"],a:1,e:["mkdir membuat direktori baru.","mkdir creates a new directory."]},
{t:["Membuat file kosong bernama catatan.txt dapat menggunakan …","Which command can create an empty file named notes.txt?"],o:["touch catatan.txt","mkdir catatan.txt","cd catatan.txt","pwd catatan.txt"],a:0,e:["touch membuat file kosong jika file belum ada, atau memperbarui timestamp jika sudah ada.","touch creates an empty file if it does not exist, or updates its timestamp if it does."]},
{t:["Menyalin file a.txt menjadi b.txt menggunakan …","Which command copies a.txt to b.txt?"],o:["mv a.txt b.txt","cp a.txt b.txt","rm a.txt b.txt","cat a.txt b.txt"],a:1,e:["cp menyalin file; file sumber tetap ada.","cp copies a file; the source remains in place."]},
{t:["Memindahkan file laporan.txt ke folder Arsip menggunakan …","Which command moves report.txt into the Archive folder?"],o:["cp laporan.txt Arsip/","mv laporan.txt Arsip/","rm laporan.txt Arsip/","touch laporan.txt Arsip/"],a:1,e:["mv memindahkan file atau mengganti nama file.","mv moves a file or renames it."]},
{t:["Menghapus file bernama sementara.txt menggunakan …","Which command removes a file named temporary.txt?"],o:["rmdir sementara.txt","rm sementara.txt","del -folder sementara.txt","erase sementara.txt"],a:1,e:["rm menghapus file. Periksa nama dan lokasi sebelum menjalankannya karena penghapusan dapat sulit dipulihkan.","rm removes files. Check the name and location first because deletion may be difficult to recover."]},
{t:["Melihat isi file teks dengan cepat di terminal dapat menggunakan …","Which command quickly displays a text file in the terminal?"],o:["cat file.txt","mkdir file.txt","chmod file.txt","cd file.txt"],a:0,e:["cat menampilkan isi file teks ke standard output.","cat prints a text file's contents to standard output."]},
{t:["Membaca file panjang halaman demi halaman paling nyaman dengan …","Which command is useful for reading a long file page by page?"],o:["less file.txt","touch file.txt","rmdir file.txt","pwd file.txt"],a:0,e:["less memungkinkan navigasi maju/mundur pada file panjang; tekan q untuk keluar.","less allows forward/backward navigation through long files; press q to quit."]},
{t:["Menampilkan 10 baris pertama file data.csv menggunakan …","Which command displays the first 10 lines of data.csv?"],o:["tail -n 10 data.csv","head -n 10 data.csv","grep -n 10 data.csv","wc -l 10 data.csv"],a:1,e:["head menampilkan bagian awal file; secara default 10 baris.","head displays the beginning of a file; the default is 10 lines."]},
{t:["Mencari teks 'energy' di dalam file hasil.txt menggunakan …","Which command searches for the text 'energy' in results.txt?"],o:["grep energy hasil.txt","find energy hasil.txt","cd energy hasil.txt","mkdir energy hasil.txt"],a:0,e:["grep mencari pola teks dalam isi file. find digunakan untuk mencari file/direktori berdasarkan nama atau atribut.","grep searches text patterns inside files. find searches for files/directories by name or attributes."]},
{t:["Menghitung jumlah baris dalam file teks menggunakan …","Which command counts the number of lines in a text file?"],o:["wc -l file.txt","count file.txt","nl -c file.txt","lines file.txt"],a:0,e:["wc -l menghitung jumlah baris (newline) pada file.","wc -l counts the number of lines (newline characters) in a file."]},
{t:["Mencari file bernama report.pdf mulai dari direktori saat ini menggunakan …","Which command searches from the current directory for a file named report.pdf?"],o:["grep report.pdf .","find . -name report.pdf","locate . report.pdf","ls -find report.pdf"],a:1,e:["find . -name report.pdf mencari nama file secara rekursif dari direktori saat ini.","find . -name report.pdf recursively searches for that filename from the current directory."]},
{t:["Menampilkan identitas pengguna yang sedang login menggunakan …","Which command displays the current logged-in username?"],o:["whoami","hostname","uname","userset"],a:0,e:["whoami menampilkan nama akun efektif yang sedang menjalankan shell.","whoami prints the effective username running the shell."]},
{t:["Menampilkan nama host komputer menggunakan …","Which command displays the computer's hostname?"],o:["whoami","hostname","pwd","date"],a:1,e:["hostname menampilkan nama host komputer.","hostname displays the computer's host name."]},
{t:["Menampilkan kapasitas dan ruang disk filesystem dalam format mudah dibaca menggunakan …","Which command shows filesystem disk space in human-readable units?"],o:["du -sh","df -h","free -m","disk -l"],a:1,e:["df -h menampilkan kapasitas filesystem dan ruang yang tersedia dengan satuan mudah dibaca. du -sh mengukur pemakaian direktori/file.","df -h shows filesystem capacity and available space in human-readable units. du -sh measures directory/file usage."]},
{t:["Melihat penggunaan memori RAM secara ringkas menggunakan …","Which command gives a summary of RAM usage?"],o:["free -h","df -h","pwd","chmod"],a:0,e:["free -h menampilkan total, penggunaan, dan memori yang tersedia dalam satuan mudah dibaca.","free -h displays total, used, and available memory in human-readable units."]},
{t:["Menampilkan bantuan penggunaan suatu perintah, misalnya ls, dapat menggunakan …","Which command displays documentation for a command such as ls?"],o:["man ls","helpfile ls","read ls","infofile ls"],a:0,e:["man ls membuka manual untuk perintah ls; tekan q untuk keluar.","man ls opens the manual page for ls; press q to quit."]}
];
let lang='id',answers=Array(bank.length).fill(null),done=false,lastScore=null;
const $=id=>document.getElementById(id);
function tr(id,en){return lang==='id'?id:en}
function render(){
$('title').textContent=tr('Pre-test Dasar Linux','Linux Fundamentals Pre-test');
$('intro').textContent=tr('Tes ini mengukur pemahaman perintah Linux umum yang sering digunakan sehari-hari. Soal tidak menguji perintah HPC, SLURM, atau ORCA.','This test assesses common everyday Linux commands. It does not test HPC, SLURM, or ORCA commands.');
$('lang').textContent=tr('English','Bahasa Indonesia');$('reset').textContent=tr('Ulangi','Reset');$('finish').textContent=tr('Hitung skor','Calculate score');$('csv').textContent=tr('Unduh hasil CSV','Download CSV');
$('questions').innerHTML=bank.map((q,i)=>'<section class="qcard"><strong>'+(i+1)+'. '+q.t[lang==='id'?0:1]+'</strong><div class="answers">'+q.o.map((v,j)=>'<label><input type="radio" name="q'+i+'" value="'+j+'" '+(answers[i]===j?'checked':'')+' '+(done?'disabled':'')+'><span><b>'+String.fromCharCode(65+j)+'.</b> '+v+'</span></label>').join('')+'</div><div id="fb'+i+'"></div></section>').join('');
document.querySelectorAll('input[type=radio]').forEach(x=>x.addEventListener('change',e=>{answers[+e.target.name.slice(1)]=+e.target.value;update()}));update();if(done)showFeedback();
}
function update(){const n=answers.filter(x=>x!==null).length;$('counter').textContent=n+' / '+bank.length+tr(' dijawab',' answered');$('bar').style.width=(n/bank.length*100)+'%'}
function showFeedback(){bank.forEach((q,i)=>{const ok=answers[i]===q.a;$('fb'+i).innerHTML='<div class="feedback '+(ok?'good':'bad')+'">'+(ok?'✓ ':'✗ ')+tr('Jawaban benar: ','Correct answer: ')+String.fromCharCode(65+q.a)+'. '+q.o[q.a]+'<br>'+q.e[lang==='id'?0:1]+'</div>'})}
function finish(){if(answers.some(x=>x===null)){alert(tr('Jawab semua soal terlebih dahulu.','Please answer all questions first.'));return}done=true;const s=answers.filter((x,i)=>x===bank[i].a).length,p=Math.round(s/bank.length*100);lastScore={s,p};$('score').textContent=tr('Skor: ','Score: ')+s+'/'+bank.length+' ('+p+'/100)';$('summary').textContent=p>=85?tr('Sangat baik. Anda siap mengikuti praktik terminal Linux.','Excellent. You are ready for the Linux terminal practical.'):p>=65?tr('Cukup baik. Pelajari kembali jawaban yang salah.','Good progress. Review the incorrect answers.'):tr('Pelajari kembali command dasar Linux sebelum praktik.','Review basic Linux commands before the practical.');$('csv').disabled=false;render()}
$('lang').onclick=()=>{lang=lang==='id'?'en':'id';render();if(lastScore){$('score').textContent=tr('Skor: ','Score: ')+lastScore.s+'/'+bank.length+' ('+lastScore.p+'/100)';$('summary').textContent=lastScore.p>=85?tr('Sangat baik. Anda siap mengikuti praktik terminal Linux.','Excellent. You are ready for the Linux terminal practical.'):lastScore.p>=65?tr('Cukup baik. Pelajari kembali jawaban yang salah.','Good progress. Review the incorrect answers.'):tr('Pelajari kembali command dasar Linux sebelum praktik.','Review basic Linux commands before the practical.')}};$('reset').onclick=()=>{answers=Array(bank.length).fill(null);done=false;lastScore=null;$('score').textContent=tr('Skor belum dihitung.','Score not calculated.');$('summary').textContent=tr('Jawab semua soal untuk melihat skor akhir.','Answer all questions to see your final score.');$('csv').disabled=true;render()};$('finish').onclick=finish;
$('csv').onclick=()=>{const rows=[['No','Question','Selected','Correct','Result'],...bank.map((q,i)=>[i+1,q.t[lang==='id'?0:1],answers[i]===null?'':q.o[answers[i]],q.o[q.a],answers[i]===q.a?'Correct':'Incorrect'])];const csv=rows.map(r=>r.map(v=>'"'+String(v).replace(/"/g,'""')+'"').join(',')).join('\n');const a=document.createElement('a');const url=URL.createObjectURL(new Blob(['\ufeff'+csv],{type:'text/csv;charset=utf-8'}));a.href=url;a.download='simonusa-linux-fundamentals-pretest.csv';a.click();setTimeout(()=>URL.revokeObjectURL(url),1000)};
render();
</script></body></html>
